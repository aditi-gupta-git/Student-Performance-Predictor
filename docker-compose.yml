version: '3.8'

services:
  student-performance-predictor:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./artifacts:/app/artifacts
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s